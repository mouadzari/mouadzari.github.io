<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Géolocalisation et 3D</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.158.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.158.0/examples/jsm/"}}
    </script>
    <style>
        body { margin: 0; overflow: hidden; }
        #map { position: absolute; top: 0; right: 0; width: 35%; height: 100vh; z-index: 1; }
        canvas { display: block; width: 65% !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <nav>
        <a href="../../">R5.06</a>
        <a href="../../../">Accueil</a>
    </nav>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, (innerWidth * 0.65) / innerHeight, 0.1, 100);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(devicePixelRatio);
        renderer.setSize(innerWidth * 0.65, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        let selectedMapMarker;

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(5, 3, 5);
        scene.add(sun);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.minDistance = 1.35;
        controls.maxDistance = 6;

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        earthTexture.colorSpace = THREE.SRGBColorSpace;
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(1, 64, 64),
            new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.9 })
        );
        scene.add(earth);

        function latLonToCartesian(latitude, longitude, radius) {
            const latitudeRadians = THREE.MathUtils.degToRad(latitude);
            const longitudeRadians = THREE.MathUtils.degToRad(longitude);
            return new THREE.Vector3(
                radius * Math.cos(latitudeRadians) * Math.cos(longitudeRadians),
                radius * Math.sin(latitudeRadians),
                -radius * Math.cos(latitudeRadians) * Math.sin(longitudeRadians)
            );
        }

        const markerGroup = new THREE.Group();
        earth.add(markerGroup);
        const rotatingFlags = [];
        let selectedGlobeMarker;
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let globePress;

        renderer.domElement.addEventListener('pointerdown', event => {
            globePress = { time: performance.now(), x: event.clientX, y: event.clientY };
        });

        renderer.domElement.addEventListener('pointerup', event => {
            if (!globePress) return;
            const distance = Math.hypot(event.clientX - globePress.x, event.clientY - globePress.y);
            globePress.isClick = performance.now() - globePress.time < 300 && distance < 5;
        });

        renderer.domElement.addEventListener('pointercancel', () => {
            globePress = null;
        });

        function focusEarth(latitude, longitude) {
            const position = latLonToCartesian(latitude, longitude, 1).normalize();
            earth.quaternion.setFromUnitVectors(position, new THREE.Vector3(0, 0, 1));
        }

        function selectLocation(latitude, longitude) {
            focusEarth(latitude, longitude);

            if (selectedMapMarker) map.removeLayer(selectedMapMarker);
            selectedMapMarker = L.marker([latitude, longitude]).addTo(map);
            selectedMapMarker.on('click', () => selectLocation(latitude, longitude));

            if (selectedGlobeMarker) markerGroup.remove(selectedGlobeMarker);
            selectedGlobeMarker = new THREE.Mesh(
                new THREE.SphereGeometry(0.016, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xffff00 })
            );
            selectedGlobeMarker.position.copy(latLonToCartesian(latitude, longitude, 1.04));
            markerGroup.add(selectedGlobeMarker);
        }

        function addUserMarker(latitude, longitude) {
            const position = latLonToCartesian(latitude, longitude, 1.025);
            const marker = new THREE.Mesh(
                new THREE.SphereGeometry(0.01, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff0000 })
            );
            marker.position.copy(position);
            markerGroup.add(marker);
        }

        function addFlagMarker(country) {
            if (!country.latlng || country.latlng.length < 2 || !country.flags?.png) return;
            const position = latLonToCartesian(country.latlng[0], country.latlng[1], 1.05);
            const flagTexture = textureLoader.load(country.flags.png);
            flagTexture.colorSpace = THREE.SRGBColorSpace;
            const flagMaterials = Array.from({ length: 6 }, () => new THREE.MeshBasicMaterial({ map: flagTexture }));
            const flag = new THREE.Mesh(
                new THREE.BoxGeometry(0.01, 0.01, 0.01),
                flagMaterials
            );
            flag.position.copy(position);
            flag.lookAt(new THREE.Vector3(0, 0, 0));
            flag.userData.country = country;
            markerGroup.add(flag);
            rotatingFlags.push(flag);
        }

        async function loadCountries() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/mledoze/countries/master/countries.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const countries = (await response.json())
                    .filter(country => country.latlng?.length === 2 && country.cca2)
                    .map(country => ({
                        ...country,
                        flags: { png: `https://flagcdn.com/w160/${country.cca2.toLowerCase()}.png` }
                    }))
                    .sort((first, second) => first.name.common.localeCompare(second.name.common));
                countries.forEach(addFlagMarker);
            } catch (error) {
                console.error('Impossible de charger les pays :', error);
            }
        }

        if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
                position => addUserMarker(position.coords.latitude, position.coords.longitude),
                error => console.warn('Géolocalisation refusée ou indisponible :', error.message),
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        loadCountries();

        map.on('click', event => {
            selectLocation(event.latlng.lat, event.latlng.lng);
        });

        renderer.domElement.addEventListener('click', event => {
            if (!globePress?.isClick) {
                globePress = null;
                return;
            }
            globePress = null;
            const bounds = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
            pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersections = raycaster.intersectObjects(rotatingFlags);
            const country = intersections[0]?.object.userData.country;
            if (country) {
                selectLocation(country.latlng[0], country.latlng[1]);
                map.setView(country.latlng, 4);
                return;
            }

            const earthIntersection = raycaster.intersectObject(earth)[0];
            if (earthIntersection) {
                const position = earth.worldToLocal(earthIntersection.point.clone()).normalize();
                const latitude = THREE.MathUtils.radToDeg(Math.asin(position.y));
                const longitude = THREE.MathUtils.radToDeg(Math.atan2(-position.z, position.x));
                selectLocation(latitude, longitude);
                map.setView([latitude, longitude], 4);
            }
        });

        addEventListener('resize', () => {
            camera.aspect = (innerWidth * 0.65) / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth * 0.65, innerHeight);
            map.invalidateSize();
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            rotatingFlags.forEach(flag => {
                flag.rotation.y += 0.02;
                flag.rotation.z += 0.02;
                flag.rotation.x += 0.02;
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
