<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Géolocalisation et 3D</title>
    <style>body { margin: 0; overflow: hidden; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);  
        sun.position.set(5, 3, 5);
        scene.add(sun);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.minDistance = 1.3;
        controls.maxDistance = 6;

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        earthTexture.colorSpace = THREE.SRGBColorSpace;        

        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(1, 64, 64),
            new THREE.MeshStandardMaterial({ map: earthTexture })
        );
        scene.add(earth);


        function latLonToCartesian(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            return new THREE.Vector3(x, y, z);
        }

        function addUserMarker(lat, lon) {
            const userMarker = new THREE.Mesh(
                new THREE.SphereGeometry(0.03, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff0000 })
            );
            userMarker.position.copy(latLonToCartesian(lat, lon, 1.02));
            earth.add(userMarker);
        }

        if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
                position => addUserMarker(position.coords.latitude, position.coords.longitude),
                error => {
                    console.warn('Géolocalisation refusée/indisponible :', error.message);
                    addUserMarker(48.8566, 2.3522);                 // repli : Paris
                }
            );
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
